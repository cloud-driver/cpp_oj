<!DOCTYPE html>
<html>
<head>
    <title>題目管理系統</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Justus OJ 後台管理</span>
            <a href="/logout" class="btn btn-outline-light btn-sm">登出</a>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-md-5">
                <div class="card p-3 shadow-sm mb-4">
                    <h4>新增題目</h4>
                    <form method="post" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label class="form-label">題目名稱</label>
                            <input type="text" name="title" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">題目敘述</label>
                            <textarea name="description" class="form-control" rows="3" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">題目圖片 (選填)</label>
                            <input type="file" name="image" class="form-control" accept="image/*">
                        </div>
                        
                        <hr>
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h5>範例展示 (Samples)</h5>
                            <button type="button" class="btn btn-sm btn-outline-primary" onclick="addSample()">+ 新增一組</button>
                        </div>
                        <div id="samples-container">
                            <div class="card bg-light mb-2 p-2 border">
                                <label class="small fw-bold">Sample 1</label>
                                <div class="row g-2">
                                    <div class="col-6">
                                        <textarea name="sample_input[]" class="form-control form-control-sm" rows="2" placeholder="Input"></textarea>
                                    </div>
                                    <div class="col-6">
                                        <textarea name="sample_output[]" class="form-control form-control-sm" rows="2" placeholder="Output"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <hr>
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h5 class="text-danger">隱藏測試資料 (Test Cases)</h5>
                            <button type="button" class="btn btn-sm btn-outline-danger" onclick="addTestCase()">+ 新增測資</button>
                        </div>
                        <div class="alert alert-warning small py-1">注意：程式必須通過全部測資才會判定為 AC。</div>
                        
                        <div id="testcases-container">
                            <div class="card mb-2 p-2 border border-danger">
                                <label class="small fw-bold text-danger">Test Case 1</label>
                                <div class="mb-1">
                                    <textarea name="test_input[]" class="form-control form-control-sm" rows="2" placeholder="標準輸入 (Hidden Input)" required></textarea>
                                </div>
                                <div>
                                    <textarea name="test_output[]" class="form-control form-control-sm" rows="2" placeholder="標準輸出 (Expected Output)" required></textarea>
                                </div>
                            </div>
                        </div>
                        
                        <button type="submit" class="btn btn-success w-100 mt-3">新增題目</button>
                    </form>
                </div>
            </div>

            <div class="col-md-7">
                <div class="card p-3 shadow-sm">
                    <h4>題目列表</h4>
                    <table class="table table-striped align-middle">
                        <thead><tr><th>ID</th><th>名稱</th><th>圖片</th><th>操作</th></tr></thead>
                        <tbody>
                            {% for p in problems %}
                            <tr>
                                <td>{{ p.id }}</td>
                                <td>{{ p.title }}</td>
                                <td>{{ '有' if p.image_filename else '無' }}</td>
                                <td>
                                    <a href="/edit/{{ p.id }}" class="btn btn-warning btn-sm">編輯</a>
                                    <a href="/delete/{{ p.id }}" class="btn btn-danger btn-sm" onclick="return confirm('確定要刪除嗎？')">刪除</a>
                                </td>
                            </tr>
                            {% else %}
                            <tr><td colspan="4" class="text-center">無題目</td></tr>
                            {% endfor %}
                        </tbody>
                    </table>
                    <div class="mt-3 text-end"><a href="/" class="btn btn-primary">回到解題首頁</a></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function addSample() {
            const container = document.getElementById('samples-container');
            const count = container.children.length + 1;
            const html = `
                <div class="card bg-light mb-2 p-2 border">
                    <label class="small fw-bold">Sample ${count}</label>
                    <div class="row g-2">
                        <div class="col-6">
                            <textarea name="sample_input[]" class="form-control form-control-sm" rows="2" placeholder="Input"></textarea>
                        </div>
                        <div class="col-6">
                            <textarea name="sample_output[]" class="form-control form-control-sm" rows="2" placeholder="Output"></textarea>
                        </div>
                    </div>
                </div>`;
            container.insertAdjacentHTML('beforeend', html);
        }

        function addTestCase() {
            const container = document.getElementById('testcases-container');
            const count = container.children.length + 1;
            const html = `
                <div class="card mb-2 p-2 border border-danger">
                    <label class="small fw-bold text-danger">Test Case ${count}</label>
                    <div class="mb-1">
                        <textarea name="test_input[]" class="form-control form-control-sm" rows="2" placeholder="標準輸入" required></textarea>
                    </div>
                    <div>
                        <textarea name="test_output[]" class="form-control form-control-sm" rows="2" placeholder="標準輸出" required></textarea>
                    </div>
                </div>`;
            container.insertAdjacentHTML('beforeend', html);
        }
    </script>
</body>
</html>
