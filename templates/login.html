<!DOCTYPE html>
<html>
<head>
    <title>管理員登入</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center" style="height: 100vh; background-color: #f1f2f6;">
    <div class="card p-4 shadow" style="width: 350px;">
        <h3 class="text-center mb-3">管理員登入</h3>
        {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
        <form method="post">
            <div class="mb-3">
                <input type="password" name="password" class="form-control" placeholder="請輸入密碼" required>
            </div>
            <button type="submit" class="btn btn-dark w-100">登入</button>
        </form>
        <div class="text-center mt-3">
            <a href="/">回首頁</a>
        </div>
    </div>
</body>
</html>
