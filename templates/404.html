<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沒有這題喔</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .error-code {
            font-size: 6rem;
            font-weight: bold;
            color: #dc3545; /* 紅色 */
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-code">404</div>
        <h2 class="mb-4">沒有這題喔 (Problem Not Found)</h2>
        <p class="lead text-muted">
            你找的題目編號不存在，或是已經被刪除了。<br>
            系統將在 <span id="countdown" class="fw-bold text-primary">5</span> 秒後自動回到首頁。
        </p>
        <div class="mt-4">
            <a href="/" class="btn btn-primary btn-lg">現在就回首頁</a>
        </div>
    </div>

    <script>
        // 設定倒數秒數
        let seconds = 5;
        const countdownElement = document.getElementById('countdown');

        // 每秒執行一次
        const interval = setInterval(() => {
            seconds--;
            countdownElement.textContent = seconds;

            if (seconds <= 0) {
                clearInterval(interval);
                window.location.href = "/"; // 跳轉回首頁
            }
        }, 1000);
    </script>
</body>
</html>
